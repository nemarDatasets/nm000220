methodology: 'Dataset A is part of the BEETL Competition Task 2 (Motor Imagery). The data was collected in an online racing
  game format called Cybathlon2020IC. Dataset A contains data from subjects 1-3 (final phase) with 500 Hz sampling rate and
  63 EEG channels. The data underwent frequency-domain preprocessing using a bandpass filter (1-100 Hz) and a 50 Hz notch
  filter to attenuate power line interference. The competition had two phases: leaderboard (subjects 1-2) and final (subjects
  1-3). For the final phase, training data from 5 races and testing data from 10 races were provided for each subject. The
  data is segmented into 4-second trials. Motor imagery tasks include: Rest (label 0), Left hand (label 1), Right hand (label
  2), and Feet (label 3). The challenge focused on transfer learning from multiple source datasets (Cho2017, BNCI2014, PhysionetMI)
  to target datasets (Weibo2014 and Cybathlon2020IC) with different EEG setups, electrode configurations, and task definitions.
  Winning solutions employed deep learning architectures (EEGInception, EEGNet), latent subject alignment methods (Deep Sets,
  statistical alignment), domain adaptation techniques (Euclidean Alignment, Label Alignment, Maximum Classifier Discrepancy),
  and Riemannian geometry approaches (SPDNet, MDRM).'
